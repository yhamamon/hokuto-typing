<!DOCTYPE html>
<!--
  世紀末タイピング拳法 -- 北斗の拳「風」ブラインドタッチ練習ゲーム
  ============================================================
  ・コーディングスクールの生徒向け教材（タイピング練習用）
  ・単一HTMLファイルで完結。ダブルクリックでブラウザが開けば動く
  ・キャラ名・セリフは原作そのままではなく「風」のオマージュ
  ・文言や単語は下の DATA オブジェクトにまとめてあるので
    先生が後から自由に差し替え・追加できる
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世紀末タイピング拳法</title>
<style>
  /* ===== 全体の見た目（世紀末・荒野の雰囲気） ===== */
  :root{
    --bg:#0a0a0c;
    --blood:#c01818;
    --gold:#e8c04a;
    --ink:#e8e6df;
    --dim:#6a6a6a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #2a0d0d 0%, transparent 60%),
      linear-gradient(180deg,#16161a 0%, #0a0a0c 60%, #070707 100%);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  /* 背景の北斗七星っぽい星 */
  .star{position:fixed;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.5;}

  #app{position:relative;height:100vh;display:flex;flex-direction:column;}

  /* ===== 上部HUD ===== */
  #hud{
    display:flex;gap:18px;align-items:center;flex-wrap:wrap;
    padding:10px 18px;background:rgba(0,0,0,.45);
    border-bottom:2px solid var(--blood);font-size:14px;
  }
  #hud .item{display:flex;flex-direction:column;line-height:1.2;}
  #hud .lbl{font-size:11px;color:var(--dim);letter-spacing:1px;}
  #hud .val{font-size:20px;font-weight:bold;color:var(--gold);font-variant-numeric:tabular-nums;}
  #hpwrap{flex:1;min-width:160px;}
  #hpbar{height:16px;border:2px solid var(--blood);border-radius:8px;overflow:hidden;background:#1a0808;}
  #hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff3b3b,#c01818);transition:width .2s;}

  /* ===== プレイ画面 ===== */
  #field{position:relative;flex:1;overflow:hidden;}
  /* 主人公（左端の拳マーク） */
  #hero{
    position:absolute;left:24px;bottom:18%;
    font-size:64px;filter:drop-shadow(0 0 12px var(--blood));
    transition:transform .08s;z-index:5;
  }
  #hero.hit{animation:shake .25s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

  /* 地面ライン */
  #ground{position:absolute;left:0;right:0;bottom:18%;height:2px;
    background:linear-gradient(90deg,transparent,var(--dim),transparent);}

  /* 敵 */
  .enemy{
    position:absolute;bottom:18%;transform:translate(-50%,0);
    text-align:center;z-index:3;will-change:left;
  }
  .enemy .body{font-size:52px;filter:drop-shadow(0 3px 4px #000);}
  .enemy.boss .body{font-size:96px;filter:drop-shadow(0 0 18px var(--blood));}
  .enemy .word{
    margin-top:4px;background:rgba(0,0,0,.6);border:1px solid #333;border-radius:6px;
    padding:3px 8px;display:inline-block;
  }
  .enemy.target .word{border-color:var(--gold);box-shadow:0 0 12px rgba(232,192,74,.4);}
  .enemy .jp{font-size:18px;font-weight:bold;color:#fff;display:block;}
  .enemy .roman{font-size:15px;letter-spacing:1px;font-family:"Courier New",monospace;}
  .enemy .roman .done{color:var(--gold);}
  .enemy .roman .now{color:#fff;background:var(--blood);border-radius:3px;padding:0 1px;}
  .enemy .roman .rest{color:var(--dim);}

  /* 撃破エフェクト */
  .cry{position:absolute;z-index:8;font-size:34px;font-weight:bold;color:var(--blood);
    text-shadow:2px 2px 0 #000;pointer-events:none;
    animation:cryUp 1s ease-out forwards;transform:translate(-50%,-50%) rotate(-8deg);}
  @keyframes cryUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(-8deg);}
    20%{opacity:1;transform:translate(-50%,-90%) scale(1.2) rotate(-8deg);}
    100%{opacity:0;transform:translate(-50%,-160%) scale(1) rotate(-8deg);}}

  /* コンボ表示 */
  #combo{position:absolute;top:14px;left:50%;transform:translateX(-50%);
    font-size:30px;font-weight:bold;color:var(--gold);text-shadow:2px 2px 0 #000;
    opacity:0;transition:opacity .2s;z-index:6;pointer-events:none;}

  /* ミスのフラッシュ */
  #flash{position:absolute;inset:0;background:var(--blood);opacity:0;pointer-events:none;z-index:7;}
  #flash.on{animation:fl .18s;}
  @keyframes fl{0%{opacity:.35;}100%{opacity:0;}}

  /* ===== オーバーレイ（タイトル/結果） ===== */
  .overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(800px 400px at 50% 30%,rgba(120,10,10,.35),rgba(0,0,0,.92));
    padding:24px;}
  .overlay.hidden{display:none;}
  .title{font-size:min(11vw,68px);font-weight:900;letter-spacing:4px;
    color:#fff;text-shadow:0 0 18px var(--blood),3px 3px 0 #000;margin:0;}
  .title .red{color:var(--blood);}
  .sub{color:var(--gold);letter-spacing:6px;margin:6px 0 28px;font-size:15px;}
  .desc{color:var(--dim);max-width:560px;line-height:1.7;margin-bottom:24px;font-size:14px;}
  .btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .btn{
    background:linear-gradient(180deg,#1a1a1a,#0c0c0c);
    color:var(--ink);border:2px solid var(--blood);border-radius:8px;
    padding:14px 26px;font-size:17px;font-weight:bold;cursor:pointer;
    letter-spacing:2px;transition:transform .08s, background .15s;
  }
  .btn:hover{background:linear-gradient(180deg,#3a0e0e,#1a0606);transform:translateY(-2px);}
  .btn small{display:block;font-size:11px;color:var(--dim);font-weight:normal;margin-top:4px;letter-spacing:0;}
  .btn.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(232,192,74,.4);}

  /* 結果画面 */
  #rank{font-size:min(16vw,90px);font-weight:900;color:var(--gold);
    text-shadow:0 0 20px var(--blood);margin:6px 0;}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px 30px;
    margin:18px 0 26px;font-size:18px;}
  .stats .k{color:var(--dim);font-size:13px;}
  .stats .v{color:var(--gold);font-weight:bold;font-size:24px;font-variant-numeric:tabular-nums;}
  .hint{color:var(--dim);font-size:12px;margin-top:18px;}
</style>
</head>
<body>
<div id="app">
  <!-- 上部ステータス -->
  <div id="hud">
    <div id="hpwrap" class="item">
      <span class="lbl">秘孔ゲージ（体力）</span>
      <div id="hpbar"><div id="hpfill"></div></div>
    </div>
    <div class="item"><span class="lbl">スコア</span><span class="val" id="score">0</span></div>
    <div class="item"><span class="lbl">WAVE</span><span class="val" id="wave">1</span></div>
    <div class="item"><span class="lbl">速さ WPM</span><span class="val" id="wpm">0</span></div>
    <div class="item"><span class="lbl">正確率</span><span class="val" id="acc">100%</span></div>
    <div class="item"><span class="lbl">最大コンボ</span><span class="val" id="maxcombo">0</span></div>
  </div>

  <!-- プレイ画面 -->
  <div id="field">
    <div id="ground"></div>
    <div id="hero">🥋</div>
    <div id="combo"></div>
    <div id="flash"></div>

    <!-- タイトル画面 -->
    <div id="titleScreen" class="overlay">
      <h1 class="title">世紀末<span class="red">タイピング拳法</span></h1>
      <div class="sub">ー あの男の拳を継ぐ者よ ー</div>
      <div class="desc">
        荒野に現れる敵を、<b>表示された文字を打って</b>倒せ。<br>
        指は<b>ホームポジション</b>に置き、キーボードを見ずに打つのが奥義。<br>
        難易度を選んで、世紀末の覇者を目指せ！
      </div>
      <div class="btnrow" id="levelBtns">
        <button class="btn" data-level="0">初級<small>ホームポジション特訓</small></button>
        <button class="btn" data-level="1">中級<small>単語で戦う</small></button>
        <button class="btn" data-level="2">上級<small>奥義の短文</small></button>
      </div>
      <div class="hint">操作：表示されたローマ字を打つだけ／一番手前の敵を自動で狙います</div>
    </div>

    <!-- 結果画面 -->
    <div id="resultScreen" class="overlay hidden">
      <div class="sub">ー 戦いの記録 ー</div>
      <div id="rank">拳士</div>
      <div class="stats">
        <div><div class="k">スコア</div><div class="v" id="rScore">0</div></div>
        <div><div class="k">到達WAVE</div><div class="v" id="rWave">1</div></div>
        <div><div class="k">タイピング速度</div><div class="v" id="rWpm">0 WPM</div></div>
        <div><div class="k">正確率</div><div class="v" id="rAcc">100%</div></div>
        <div><div class="k">最大コンボ</div><div class="v" id="rCombo">0</div></div>
        <div><div class="k">撃破数</div><div class="v" id="rKills">0</div></div>
      </div>
      <div class="btnrow">
        <button class="btn" id="retryBtn">もう一度戦う</button>
        <button class="btn" id="backBtn">難易度を選び直す</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   DATA: 出題データ。先生はここを編集して問題を追加・変更できます。
   各敵は { jp:"画面に出る表示", roman:"実際に打つ文字" } の形。
   ========================================================================= */
const DATA = {
  // --- 初級：ホームポジション特訓（aの段・jの段中心） ---
  level0: [
    {jp:"ASDF", roman:"asdf"}, {jp:"JKL;", roman:"jkl;"},
    {jp:"FFF", roman:"fff"}, {jp:"JJJ", roman:"jjj"},
    {jp:"DK", roman:"dk"}, {jp:"SL", roman:"sl"}, {jp:"FJ", roman:"fj"},
    {jp:"ASDFJKL;", roman:"asdfjkl;"}, {jp:"FGHJ", roman:"fghj"},
    {jp:"AAA", roman:"aaa"}, {jp:";;;", roman:";;;"},
    {jp:"GH", roman:"gh"}, {jp:"DFGH", roman:"dfgh"}, {jp:"HJKL", roman:"hjkl"},
  ],
  // --- 中級：世紀末っぽい単語（ローマ字） ---
  level1: [
    {jp:"拳",   roman:"ken"},     {jp:"漢",   roman:"otoko"},
    {jp:"修羅", roman:"shura"},   {jp:"覇王", roman:"haou"},
    {jp:"荒野", roman:"kouya"},   {jp:"宿命", roman:"shukumei"},
    {jp:"蒼天", roman:"souten"},  {jp:"奥義", roman:"ougi"},
    {jp:"伝承", roman:"denshou"}, {jp:"無想", roman:"musou"},
    {jp:"剛拳", roman:"gouken"},  {jp:"閃光", roman:"senkou"},
    {jp:"咆哮", roman:"houkou"},  {jp:"気合", roman:"kiai"},
    {jp:"鉄拳", roman:"tekken"},  {jp:"豪傑", roman:"gouketsu"},
  ],
  // --- 上級：奥義の短文（オマージュのセリフ） ---
  level2: [
    {jp:"我が拳に死角無し",   roman:"wagakobushinishikakunashi"},
    {jp:"貴様はもう終わりだ", roman:"kisamahamouowarida"},
    {jp:"退かぬ媚びぬ顧みぬ", roman:"hikanukobinukaeriminu"},
    {jp:"秘孔を突く",         roman:"hikouwotsuku"},
    {jp:"世紀末の覇者",       roman:"seikimatsunohasha"},
    {jp:"強き者の宿命",       roman:"tsuyokimononoshukumei"},
    {jp:"荒野に拳が吼える",   roman:"kouyanikobushigahoeru"},
    {jp:"漢の生き様を見よ",   roman:"otokonoikizamawomiyo"},
  ],
  // --- ボス（WAVEの最後に出現する強敵） ---
  bosses: [
    {jp:"我こそ世紀末の覇者なり",   roman:"warekososeikimatsunohashanari"},
    {jp:"この拳が天をも砕く",       roman:"konokobushigatenwomokudaku"},
    {jp:"伝承者よ我を越えてみよ",   roman:"denshoushayowarewokoetemiyo"},
  ],
  // --- 撃破時の断末魔（オマージュ・ランダム表示） ---
  cries: ["ぐえええっ！","ぶしゃあっ！","ごふっ…！","ひでらばっ！","あぶしっ！","たわらばっ！","うぎゃあっ！","ぬげらっ！"],
  // --- 敵の見た目（絵文字） ---
  zakoLooks: ["🤡","👹","🦹","🧟","👺","🤺"],
  bossLook: "👹",
};

/* =========================================================================
   ゲーム本体
   ========================================================================= */
const $ = (id)=>document.getElementById(id);
const field = $("field");

// ゲーム状態
let state = null;
let rafId = null;
let lastTime = 0;

// 設定（難易度ごとの調整値）
function makeConfig(level){
  return {
    level,
    pool: DATA["level"+level],
    baseSpeed: [0.040, 0.050, 0.060][level], // 画面横幅に対する割合/秒
    spawnEvery: [1.7, 1.5, 1.4][level],      // 敵の出現間隔（秒）
    killsPerWave: 8,                          // 何体倒すとボス出現か
    damage: 18,                               // 敵に到達されたときのダメージ
    bossDamage: 30,
  };
}

function resetState(level){
  return {
    cfg: makeConfig(level),
    hp: 100,
    score: 0,
    wave: 1,
    kills: 0,
    waveKills: 0,
    combo: 0,
    maxCombo: 0,
    correctChars: 0,
    wrongChars: 0,
    startTime: performance.now(),
    enemies: [],
    target: null,
    spawnTimer: 0,
    bossActive: false,
    bossPending: false,
    running: true,
    enemyId: 0,
  };
}

// ---- 敵の生成 ----
function spawnEnemy(isBoss){
  const s = state;
  let data;
  if(isBoss){
    data = DATA.bosses[(s.wave-1) % DATA.bosses.length];
  }else{
    const pool = s.cfg.pool;
    data = pool[Math.floor(Math.random()*pool.length)];
  }
  const el = document.createElement("div");
  el.className = "enemy" + (isBoss ? " boss" : "");
  const look = isBoss ? DATA.bossLook : DATA.zakoLooks[Math.floor(Math.random()*DATA.zakoLooks.length)];
  el.innerHTML =
    '<div class="body">'+look+'</div>'+
    '<div class="word"><span class="jp">'+data.jp+'</span>'+
    '<span class="roman"></span></div>';
  field.appendChild(el);

  const enemy = {
    id: ++s.enemyId,
    el,
    romanEl: el.querySelector(".roman"),
    jp: data.jp,
    roman: data.roman.toLowerCase(),
    typed: 0,
    x: 1.04,                       // 1.0=右端より少し外側から登場
    speed: s.cfg.baseSpeed * (isBoss ? 0.55 : 1) * (1 + (s.wave-1)*0.12),
    isBoss,
  };
  // ボスは縦位置を少し上げて目立たせる
  if(isBoss){ el.style.bottom = "26%"; enemy.x = 1.0; }
  s.enemies.push(enemy);
  renderRoman(enemy);
  return enemy;
}

// 打つべき文字のハイライト表示
function renderRoman(e){
  const done = e.roman.slice(0, e.typed);
  const now  = e.roman.charAt(e.typed) || "";
  const rest = e.roman.slice(e.typed+1);
  e.romanEl.innerHTML =
    '<span class="done">'+esc(done)+'</span>'+
    '<span class="now">'+esc(now)+'</span>'+
    '<span class="rest">'+esc(rest)+'</span>';
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ---- ターゲット選択：一番手前（左）の敵 ----
function pickTarget(){
  const s = state;
  if(s.bossActive){
    // ボス戦中はボスのみ狙う
    s.target = s.enemies.find(e=>e.isBoss) || null;
  }else{
    let best=null;
    for(const e of s.enemies){ if(!best || e.x < best.x) best=e; }
    s.target=best;
  }
  // 見た目の更新
  for(const e of s.enemies) e.el.classList.toggle("target", e===s.target);
}

// ---- キー入力 ----
function onKey(ev){
  if(!state || !state.running) return;
  const k = ev.key;
  if(k.length !== 1) return;          // Shift等の特殊キーは無視
  const ch = k.toLowerCase();
  ev.preventDefault();

  const s = state;
  if(!s.target) pickTarget();
  const t = s.target;
  if(!t) return;

  const expect = t.roman.charAt(t.typed);
  if(ch === expect){
    // 正解
    t.typed++;
    s.correctChars++;
    renderRoman(t);
    if(t.typed >= t.roman.length){
      defeat(t);
    }
  }else{
    // ミス
    s.wrongChars++;
    s.combo = 0;
    flashMiss();
  }
  updateHUD();
}

// ---- 敵撃破 ----
function defeat(e){
  const s = state;
  s.kills++;
  s.waveKills++;
  s.combo++;
  if(s.combo > s.maxCombo) s.maxCombo = s.combo;

  // スコア：文字数 × コンボ補正 × ボス補正
  const base = e.roman.length * 10;
  const gain = Math.round(base * (1 + s.combo*0.1) * (e.isBoss?5:1));
  s.score += gain;

  showCry(e);
  showCombo();
  removeEnemy(e);

  if(e.isBoss){
    // ボス撃破 → 次のWAVEへ。少し回復
    s.bossActive = false;
    s.wave++;
    s.waveKills = 0;
    s.hp = Math.min(100, s.hp + 25);
  }else if(s.waveKills >= s.cfg.killsPerWave && !s.bossActive && !s.bossPending){
    // 規定数倒したらボス出現フラグ
    s.bossPending = true;
  }
  pickTarget();
}

function removeEnemy(e){
  const s = state;
  s.enemies = s.enemies.filter(x=>x!==e);
  if(e.el.parentNode) e.el.parentNode.removeChild(e.el);
  if(s.target===e) s.target=null;
}

// ---- 演出 ----
function showCry(e){
  const cry = DATA.cries[Math.floor(Math.random()*DATA.cries.length)];
  const c = document.createElement("div");
  c.className="cry"; c.textContent=cry;
  const rect = e.el.getBoundingClientRect();
  const fr = field.getBoundingClientRect();
  c.style.left = (rect.left - fr.left + rect.width/2) + "px";
  c.style.top  = (rect.top  - fr.top  + rect.height/3) + "px";
  field.appendChild(c);
  setTimeout(()=>c.remove(), 1000);
}
function showCombo(){
  if(state.combo < 2) return;
  const el = $("combo");
  el.textContent = state.combo + " コンボ！";
  el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.style.opacity=0, 700);
}
function flashMiss(){
  const f=$("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
}
function heroHit(){
  const h=$("hero"); h.classList.remove("hit"); void h.offsetWidth; h.classList.add("hit");
}

// ---- メインループ ----
function loop(now){
  if(!state || !state.running) return;
  const dt = Math.min((now - lastTime)/1000, 0.05); // 大きすぎるdtを防ぐ
  lastTime = now;
  const s = state;

  // 敵の出現
  s.spawnTimer += dt;
  if(s.bossPending && s.enemies.length===0){
    // 雑魚を倒しきってからボス登場
    s.bossPending=false; s.bossActive=true;
    spawnEnemy(true);
    pickTarget();
  }else if(!s.bossActive && !s.bossPending && s.spawnTimer >= s.cfg.spawnEvery){
    s.spawnTimer = 0;
    spawnEnemy(false);
    if(!s.target) pickTarget();
  }

  // 敵の移動
  const w = field.clientWidth;
  const heroX = 90 / w;  // 主人公の位置（左から約90px）
  for(const e of [...s.enemies]){
    e.x -= e.speed * dt;
    e.el.style.left = (e.x * 100) + "%";
    if(e.x <= heroX){
      // プレイヤーに到達 → ダメージ
      s.hp -= e.isBoss ? s.cfg.bossDamage : s.cfg.damage;
      s.combo = 0;
      heroHit(); flashMiss();
      if(e.isBoss){ s.bossActive=false; s.waveKills=0; }
      removeEnemy(e);
      pickTarget();
      if(s.hp <= 0){ s.hp=0; updateHUD(); gameOver(); return; }
    }
  }

  if(!s.target) pickTarget();
  updateHUD();
  rafId = requestAnimationFrame(loop);
}

// ---- HUD更新 ----
function updateHUD(){
  const s = state;
  $("hpfill").style.width = s.hp + "%";
  $("score").textContent = s.score;
  $("wave").textContent  = s.wave;
  $("maxcombo").textContent = s.maxCombo;
  const mins = (performance.now() - s.startTime)/60000;
  const wpm = mins>0 ? Math.round((s.correctChars/5)/mins) : 0;
  $("wpm").textContent = wpm;
  const total = s.correctChars + s.wrongChars;
  const acc = total>0 ? Math.round(s.correctChars/total*100) : 100;
  $("acc").textContent = acc + "%";
}

// ---- ゲーム開始 / 終了 ----
function startGame(level){
  // 画面の敵を掃除
  field.querySelectorAll(".enemy,.cry").forEach(n=>n.remove());
  state = resetState(level);
  $("titleScreen").classList.add("hidden");
  $("resultScreen").classList.add("hidden");
  updateHUD();
  lastTime = performance.now();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function gameOver(){
  const s = state;
  s.running = false;
  cancelAnimationFrame(rafId);

  const mins = (performance.now() - s.startTime)/60000;
  const wpm = mins>0 ? Math.round((s.correctChars/5)/mins) : 0;
  const total = s.correctChars + s.wrongChars;
  const acc = total>0 ? Math.round(s.correctChars/total*100) : 100;

  // 称号判定（スコア・正確率から）
  let rank = "見習い拳士";
  if(s.score>=300) rank="荒野の拳士";
  if(s.score>=800) rank="一子相伝の使い手";
  if(s.score>=1500) rank="伝承者";
  if(s.score>=2500 && acc>=90) rank="世紀末の覇者";

  $("rank").textContent  = rank;
  $("rScore").textContent= s.score;
  $("rWave").textContent = s.wave;
  $("rWpm").textContent  = wpm + " WPM";
  $("rAcc").textContent  = acc + "%";
  $("rCombo").textContent= s.maxCombo;
  $("rKills").textContent= s.kills;
  $("resultScreen").classList.remove("hidden");
}

// ---- イベント登録 ----
document.addEventListener("keydown", onKey);
$("levelBtns").addEventListener("click", (e)=>{
  const b = e.target.closest("button[data-level]");
  if(!b) return;
  startGame(parseInt(b.dataset.level,10));
});
$("retryBtn").addEventListener("click", ()=>startGame(state.cfg.level));
$("backBtn").addEventListener("click", ()=>{
  $("resultScreen").classList.add("hidden");
  $("titleScreen").classList.remove("hidden");
});

// 背景の星をランダム配置
(function makeStars(){
  for(let i=0;i<40;i++){
    const s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*70+"vh";
    s.style.opacity=(0.2+Math.random()*0.6).toFixed(2);
    document.body.appendChild(s);
  }
})();
</script>
